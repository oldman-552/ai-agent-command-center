# Reverse proxy for AI Agent Command Center with several API replicas (DEPLOYMENT.md → Scaling out).
# Copy to /etc/nginx/conf.d/acc.conf, set server_name and the certificate paths, list your API replicas.
# No sticky sessions are needed: sessions are signed cookies, throttling and live updates go through Redis.
# backend/tests/test_replicas.py runs this file (with TLS removed and the upstream ports filled in).

upstream acc_api {
    least_conn;
    server 127.0.0.1:8000;          # ACC_API_SERVERS — one line per API replica
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream acc_web {
    server 127.0.0.1:3000;          # ACC_WEB_SERVER
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name acc.example.com;    # ACC_HTTP_REDIRECT
    return 301 https://$host$request_uri;
}

server {
    # `listen … ssl http2` works on nginx 1.24 (Ubuntu 24.04) and later; 1.25.1+ also accepts `http2 on;`
    listen 443 ssl http2;           # ACC_LISTEN
    server_name acc.example.com;
    ssl_certificate     /etc/ssl/acc/fullchain.pem;   # ACC_TLS
    ssl_certificate_key /etc/ssl/acc/privkey.pem;     # ACC_TLS
    ssl_protocols TLSv1.2 TLSv1.3;                    # ACC_TLS
    add_header Strict-Transport-Security "max-age=31536000" always;   # ACC_TLS

    client_max_body_size 25m;

    # live updates: WebSocket upgrade, long-lived
    location = /api/ws {
        proxy_pass http://acc_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API (also A2A, MCP and server-sent events: buffering off so streams are not held back)
    location /api/ {
        proxy_pass http://acc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://acc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
