[project]
name = "acc-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "croniter>=6",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=1.20,<2",
    "openai>=3.48.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-sdk>=1.30",
    "playwright==1.63.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "redis>=5.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two tiers that leave this machine. Both are skipped unless the owner supplies the settings named in the test files.
markers = [
    "real_provider: calls a real model API with the owner's key (WF-21); costs money; see tests/test_real_provider.py",
    "real_arena: sends prompts to Arena through a real Arena Local Bridge (WF-20); see tests/test_real_arena.py",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI dependency injection idiom: Depends(...) in defaults

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]  # re-export module
